name: Monitor prezzi
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      force_daily:
        description: "Invia subito il riepilogo giornaliero"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: onepiece-state
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: onepiece-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python daily_deals.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          FORCE_DAILY: ${{ github.event.inputs.force_daily }}
      - name: Salva stato anche dopo errori di invio
        if: ${{ always() }}
        run: bash save_state.sh
